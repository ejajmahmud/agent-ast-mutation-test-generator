[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ast-mutation-test-generator"
version = "0.1.0"
description = "High-throughput AST mutator evaluating test suite quality by injecting subtle synthetic mutants into generated Python code"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ast-mutation-test-generator = "agent_ast_mutation_test_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ast_mutation_test_generator*"]
